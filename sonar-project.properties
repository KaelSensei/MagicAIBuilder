sonar.projectKey=KaelSensei_MagicAIBuilder
sonar.organization=kaelsensei
sonar.projectName=MagicAIBuilder
sonar.projectVersion=1.0

# Sources
sonar.sources=src
sonar.exclusions=**/__tests__/**,**/e2e/**,**/*.test.ts,**/*.spec.ts,**/node_modules/**

# Test files
sonar.tests=__tests__,e2e
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage (generated by pnpm test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude files that can't be unit-tested (Next.js app shell + React components → covered by Playwright E2E)
sonar.coverage.exclusions=src/app/**,src/components/**,src/generated/**

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json
