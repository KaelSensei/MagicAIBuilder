sonar.projectKey=KaelSensei_MagicAIBuilder
sonar.organization=kaelsensei
sonar.projectName=MagicAIBuilder
sonar.projectVersion=1.0

# Sources (exclude test files from main analysis)
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/e2e/**,**/node_modules/**

# Test files (colocated in src/, E2E in e2e/)
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Coverage (generated by pnpm test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions - KNOWN GAP, left in place deliberately, see below.
#
# The stated reason ("can't be unit-tested ... covered by Playwright E2E") is
# not true: 53 unit test files live under these two paths, and vitest.config.ts
# now measures them. What these two entries do is keep 19,467 of the
# repository's 29,231 statements out of the quality gate - which means the
# `new_coverage < 80` condition CANNOT SEE a new untested API route or React
# component at all. A PR adding 300 uncovered lines under src/app or
# src/components still reports whatever the lib/ code did. That is how 79 of
# 125 component files and 48 of 69 app files arrived at 0%.
#
# Removing them is the right end state and is not free: the new-code window
# already holds uncovered lines under both paths, so the gate would very likely
# go red on the next PR and stay red until those are covered. That is a
# deliberate decision with a cost to schedule, not a config tidy-up - make it
# on its own, with the tests written to land alongside it.
sonar.coverage.exclusions=src/app/**,src/components/**,src/generated/**

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Suppress false positives: React Three Fiber JSX uses non-standard HTML props
# (position, args, roughness, metalness, intensity, emissive, etc.)
# SonarCloud S6747 "Unknown property" doesn't understand R3F intrinsic elements.
sonar.issue.ignore.multicriteria=r3f,acttests,paramtests
sonar.issue.ignore.multicriteria.r3f.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.r3f.resourceKey=src/components/landing/**
# S8980 flags `await act(async () => await asyncHookCall())` as redundant, but for
# React Testing Library async hook updates removing act() triggers "not wrapped in
# act" warnings and fails the assertions — a false positive. Scope it to test files.
sonar.issue.ignore.multicriteria.acttests.ruleKey=typescript:S8980
sonar.issue.ignore.multicriteria.acttests.resourceKey=**/*.test.*
# S5976 ("parameterize similar tests") is a stylistic preference, not a defect;
# explicit per-case tests are often clearer. Don't enforce it on test files.
sonar.issue.ignore.multicriteria.paramtests.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.paramtests.resourceKey=**/*.test.*
