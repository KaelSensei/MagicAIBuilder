services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: magicaibuilder
      POSTGRES_USER: magic
      # Override via POSTGRES_PASSWORD env var in production — never use default in prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magic_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d magicaibuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
