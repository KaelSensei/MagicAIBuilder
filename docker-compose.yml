services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: magicaibuilder
      POSTGRES_USER: magic
      # Override via POSTGRES_PASSWORD env var in production — never use default in prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magic_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d magicaibuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://magic:magic_dev_only@db:5432/magicaibuilder
      - NODE_ENV=test
      - SKIP_ENV_VALIDATION=true
      - NEXTAUTH_SECRET=e2e-test-secret-not-for-production
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm exec playwright test"
    environment:
      - BASE_URL=http://nextjs:3000
      - CI=true
    depends_on:
      nextjs:
        condition: service_healthy

volumes:
  pgdata:
