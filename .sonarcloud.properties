sonar.sources=src
sonar.exclusions=**/__tests__/**,**/e2e/**,**/*.test.ts,**/*.spec.ts,**/node_modules/**,src/generated/**
sonar.tests=__tests__,e2e
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# React components and Next.js app shell need E2E/integration tests (not unit-testable)
# Unit test coverage applies to src/lib/** and src/hooks/**
sonar.coverage.exclusions=src/app/**,src/components/**,src/generated/**
