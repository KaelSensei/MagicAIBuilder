version: 2

# Dependabot opens against `staging`, not the default branch.
#
# Feature and fix PRs target `staging` and are promoted `staging` -> `dev` ->
# `main`; a bot opening straight onto `main` would be the one contributor
# exempt from that, and would push `main` ahead of the two branches meant to
# gate it. The first github-actions PR did exactly that before this was set.
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Only allow patch and minor updates — major versions are reviewed manually
    # to avoid breaking changes (TypeScript, Prisma, ESLint, Next.js, etc.)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # The workflows pin actions/checkout, actions/setup-node, actions/upload-artifact,
  # pnpm/action-setup and SonarSource/sonarqube-scan-action by major tag. Nothing
  # was watching them, so a tag going stale — or an advisory against one — showed
  # up only when a run started warning about it (the SonarCloud job already warns
  # that its Node 20 runtime is deprecated).
  #
  # Majors are NOT ignored here, unlike the npm config above: an action's breaking
  # changes are usually a runner-version bump, the PR is a one-line diff, and CI
  # proves it on the spot. Holding those back is how a workflow ends up pinned to
  # a runtime GitHub has stopped supporting.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
