name: CI

# Feature branches target `staging`, which is then promoted to `dev` and on to
# `main`. Scoped to `main` alone, this workflow first saw a change on the
# promotion PR — after review, after it had already landed in the integration
# branch. Every gate now runs on the PR that actually carries the change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads packageManager from
      # package.json. Declaring both makes it fail with
      # "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production tree only. Critical advisories fail the job; high ones are
      # reported but do not block, because as of 2026-08-20 five transitive
      # highs (sharp/postcss under next@15, defu/deepmerge-ts under prisma@6)
      # are only fixable by the Next 16 / Prisma 7 majors. Tighten to
      # --audit-level=high once those land.
      - name: Audit production dependencies (critical blocks)
        run: pnpm audit --prod --audit-level=critical

      - name: Audit production dependencies (high, report only)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          SKIP_ENV_VALIDATION: true
