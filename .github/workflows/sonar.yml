name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on PRs only (keeps badge green on main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Expose the token at job level so the `if` guard on the scan step can read it
    # (a step-level env is not visible to that step's own `if` condition).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for blame/new code detection

      # No `version:` here on purpose — the action reads packageManager from
      # package.json. Declaring both makes it fail with
      # "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm" # Cache node_modules between runs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/test' }}

      # A fork PR never receives secrets — GitHub withholds them so a modified
      # workflow cannot exfiltrate them. That is not a misconfiguration, so it
      # must not fail the run; it is announced instead of passing quietly.
      - name: Note skipped scan on a fork PR
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          echo "::warning::Fork PR — GitHub withholds secrets from forks, so no SonarCloud analysis ran for this branch."

      # Fail loudly rather than skip. This step used to carry
      # `if: env.SONAR_TOKEN != ''`, so a missing secret silently skipped the
      # analysis while the job still reported success. SonarCloud kept serving a
      # months-old snapshot, and the "open issues = 0" check in the pre-PR
      # checklist was reading that snapshot rather than the code under review.
      - name: Require SONAR_TOKEN
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            echo "Without it no analysis runs, and SonarCloud keeps reporting the previous revision as if it were current."
            exit 1
          fi

      - name: SonarCloud Scan
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io
