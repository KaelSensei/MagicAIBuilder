name: Lighthouse CI

# Feature branches target `staging`, which is then promoted to `dev` and on to
# `main`. Scoped to `main` alone, this workflow first saw a change on the
# promotion PR — after review, after it had already landed in the integration
# branch. Every gate now runs on the PR that actually carries the change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    name: Performance, a11y and SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` here on purpose — see the note in ci.yml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          SKIP_ENV_VALIDATION: true
          # Inlined into the bundle at build time, so it has to be set here and
          # not only on the audit step.
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      # No database is started. Every audited URL is a public page and the
      # session strategy is JWT, so an anonymous visit issues no query — see
      # the URL list in lighthouserc.yml.
      - name: Run Lighthouse CI
        run: pnpm lighthouse
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          AUTH_SECRET: lighthouse-ci-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Must match the origin the audit fetches from. Left unset, siteUrl()
          # falls back to the production domain while the page is served from
          # localhost, so every canonical points off-origin and Lighthouse
          # reports "points to another hreflang location" — SEO 92 instead of
          # 100, for a mismatch that cannot happen in production. Worse, that
          # standing failure would hide a real canonical defect behind it.
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      # `include-hidden-files` is not optional here: `.lighthouseci` is a
      # dot-directory and upload-artifact@v4 skips those by default, so the
      # first run wrote all nine reports and uploaded none of them — a green
      # job with an empty artifact. `if-no-files-found: error` (the default is
      # `warn`) makes that state loud instead of silent if it ever returns.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
